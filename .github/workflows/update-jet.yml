name: Update GitHub Jet Heatmap

on:
  schedule:
    - cron: "0 0 * * *"   # Runs daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate SVG
        env:
          GH_USERNAME: Swoasti07
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node generate.mjs
          cp dist/github-jet.svg github-jet.svg
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --staged --quiet || git commit -m "Auto-update GitHub Jet Heatmap"
          git push